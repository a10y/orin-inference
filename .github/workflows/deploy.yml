name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual re-deploy of the latest main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Byte-compile Python
        run: python3 -m compileall -q server
      - name: Shellcheck
        run: shellcheck run.sh deploy/*.sh

  deploy:
    needs: check
    # Only real pushes to main (or a manual run on main) ever reach the device.
    # Pull requests, including from forks, run the checks above and nothing else.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secrets live in this environment, which is restricted to the main branch.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Join tailnet as an ephemeral tag:ci node
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          log-mode: quiet

      # New nodes take a moment to propagate across the tailnet. This waits for the
      # device without printing its address (the action's `ping` input logs it).
      - name: Wait for device
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for _ in $(seq 1 36); do
            tailscale ping -c 1 --timeout 5s "$DEPLOY_HOST" >/dev/null 2>&1 && exit 0
            sleep 5
          done
          echo "::error::device not reachable over Tailscale after 3 minutes"
          exit 1

      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # The key's authorized_keys entry forces deploy/ssh-entry.sh, so this is
          # the only command it can run. -q and LogLevel=ERROR keep the host out of the log.
          ssh -q -o LogLevel=ERROR -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
              "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
